# echidna-registry-assertion.yaml
# Runs the assert()-based test* functions:
#   - testInactiveStrategistCannotRecord
#   - testUnregisteredStrategistRejectedEverywhere
#   - testReassignPoolFullyMovesOwnership
#   - testDoubleAssignAlwaysReverts
#
# sender intentionally omitted so Echidna uses its default sender
# (= address(this), the deploying test contract), which matches the
# constructor's own DEFAULT_ADMIN_ROLE / REGISTRAR_ROLE grants.

testMode: "assertion"
seqLen: 100
testLimit: 50000
workers: 2
corpusDir: "echidna-corpus-registry-assertion"
coverage: true
codeSize: 0x20000
